services:
  backend:
    image: skyengine-backend:latest
    build:
      context: .
      dockerfile: application/dockerfile/backend.Dockerfile
      network: host
    container_name: skyengine-backend
    ports:
      - "${BACKEND_PORT:-8233}:8000"
      # 训练平台可选 TensorBoard 端口
      - "${TENSORBOARD_PORT:-6006}:6006"
    volumes:
      - ./application:/app/application
      - ./executor:/app/executor
      - ./experiment:/app/experiment
      # DFJSP-T 插件仓库与 skyengine 并列，挂载后训练平台可动态加载算法包
      - ../skyengine-DFJSPT:/app/skyengine-DFJSPT:ro
      - ./config:/app/config
      - ./dataset:/app/dataset
      # Docker Socket — 用于 DockerProxy 按需启停 SkyEngine compose 栈
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${SKYENGINE_COMPOSE_PATH:?SKYENGINE_COMPOSE_PATH not set}
        target: /opt/skyengine/docker-compose-online.yaml
        read_only: true
      - type: bind
        source: ${SKYENGINE_BATCH_COMPOSE_PATH:?SKYENGINE_BATCH_COMPOSE_PATH not set}
        target: /opt/skyengine/docker-compose-batch.yaml
        read_only: true
      # 宿主机路径只作为挂载源；容器内统一使用 Linux 路径，避免 Windows 盘符被解析成卷分隔符。
      - type: bind
        source: ${SKYENGINE_PROJECT_HOST_DIR:?SKYENGINE_PROJECT_HOST_DIR not set}
        target: /opt/skyengine/project
        read_only: true
    environment:
      - PYTHONUNBUFFERED=1
      - SKYENGINE_COMPOSE_PATH=/opt/skyengine/docker-compose-online.yaml
      - SKYENGINE_BATCH_COMPOSE_PATH=/opt/skyengine/docker-compose-batch.yaml
      - SKYENGINE_PROJECT_DIR=/opt/skyengine/project
      # DockerProxy 在 Linux 容器内调用 Compose；这里必须传 Docker Desktop VM
      # 可识别的宿主机路径，不能直接传 Windows 盘符路径。
      - SKYENGINE_PROJECT_HOST_DIR=${SKYENGINE_DOCKER_HOST_DIR:?SKYENGINE_DOCKER_HOST_DIR not set}
      - SKYENGINE_BATCH_DATASET_HOST_DIR=/app/dataset
      - ENGINE_URL=http://engine:8080
    networks:
      - skyengine-network
    # 给 uvicorn graceful shutdown + atexit 清理 online 栈留足时间
    # (compose down online --timeout 8 ≈ 8-10s + 启动开销)
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    image: skyengine-frontend:latest
    build:
      context: .
      dockerfile: application/dockerfile/frontend.Dockerfile
      network: host
    container_name: skyengine-frontend
    ports:
      - "${FRONTEND_PORT:-5180}:5173"
    volumes:
      - ./application/frontend:/app
      - skyengine-frontend-node-modules:/app/node_modules
    environment:
      - PYTHONUNBUFFERED=1
      # SkyEngine application backend 地址；容器内使用 Compose 服务名
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
      # RAG 后端地址 — 需在 .env 中设置 RAG_BACKEND_URL
      - RAG_BACKEND_URL=${RAG_BACKEND_URL:-http://backend:8000}
    depends_on:
      - backend
      # - rag-helper
    networks:
      - skyengine-network
    restart: unless-stopped

